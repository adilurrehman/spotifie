<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your Spotifie account.">
    <title>Choose a new password - Spotifie</title>

    <!-- What this page is, for a browser, a search engine and a shared link. The
         canonical address, the social image and the structured record are added by
         the server at the marker below, because only it knows where this
         installation has been published. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Spotifie is dark unless this browser has been told otherwise, so the
         browser chrome around it is too. One colour, not one per system
         setting: what the operating system prefers does not decide what this
         page looks like, and a bar disagreeing with the page under it would
         only look like a mistake. -->
    <meta name="theme-color" content="#121212">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Spotifie">
    <!--site-meta-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utlity.css">
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicons/favicon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Spotifie">
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Supabase SDK -->
    <!-- What this copy of Spotifie is: a checkout somebody is running, or a
         copy published to a static host that carries its own settings. Read
         before anything asks a question, so nothing has to ask an origin
         that has no answer. config.js exists only in a published copy; a
         checkout has none, which is itself the answer. -->
    <script src="js/config.js"></script>
    <script src="js/deployment.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Apply theme immediately to prevent flash
        (function() {
            // Dark unless this browser has been told otherwise. Set here, before
            // any stylesheet or script, so nothing is ever painted light first.
            const savedTheme = localStorage.getItem('spotify_theme');
            document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        })();
    </script>
    <style>
        /* Auth Page Specific Styles */
        .auth-page {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 40px;
            background: transparent;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .auth-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .auth-logo span {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] .auth-card {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .auth-icon {
            width: 64px;
            height: 64px;
            background: rgba(29, 185, 84, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .auth-icon svg {
            width: 32px;
            height: 32px;
            color: #1db954;
        }

        .auth-icon.success {
            background: rgba(29, 185, 84, 0.15);
        }

        .auth-icon.success svg {
            color: #1db954;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: #1db954;
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.2);
        }

        .form-input.error {
            border-color: #e91429;
            box-shadow: 0 0 0 3px rgba(233, 20, 41, 0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        .form-error {
            font-size: 12px;
            color: #e91429;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .auth-btn {
            width: 100%;
            padding: 14px 24px;
            background: #1db954;
            color: #000;
            border: none;
            border-radius: 500px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-btn.loading {
            position: relative;
            color: transparent;
        }

        .auth-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid #000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.visible {
            display: block;
        }

        .alert.error {
            background: rgba(233, 20, 41, 0.1);
            color: #e91429;
            border: 1px solid rgba(233, 20, 41, 0.3);
        }

        .alert.success {
            background: rgba(29, 185, 84, 0.1);
            color: #1db954;
            border: 1px solid rgba(29, 185, 84, 0.3);
        }

        /* Success State */
        .success-view {
            display: none;
            text-align: center;
        }

        .success-view.visible {
            display: block;
        }

        .form-view {
            display: block;
        }

        .form-view.hidden {
            display: none;
        }

        /* Theme Toggle */
        .theme-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        /* Password Strength */
        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            transition: background 0.2s;
        }

        .strength-bar.active {
            background: #e91429;
        }

        .strength-bar.medium {
            background: #f59e0b;
        }

        .strength-bar.strong {
            background: #1db954;
        }

        .strength-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Responsive */
        @media screen and (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }

            .auth-title {
                font-size: 24px;
            }

            .auth-logo img {
                width: 40px;
                height: 40px;
            }

            .auth-logo span {
                font-size: 24px;
            }
        }
    </style>
    <!-- Shared account-page layout, loaded last so it settles the layout -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
        <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="Toggle theme">
            <div class="theme-toggle-track">
                <div class="theme-toggle-thumb">
                    <svg class="theme-icon moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="theme-icon sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="theme-toggle-inactive-icon">
                    <svg class="theme-icon inactive-sun" width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <svg class="theme-icon inactive-moon" width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="auth-header">
        <a href="/" class="auth-logo">
            <img src="img/logo.webp" alt="Spotifie">
            <span>Spotifie</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card">
            <!-- Form View -->
            <div class="form-view" id="formView">
                <div class="auth-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>

                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">
                    Enter your new password below. Make sure it's at least 6 characters long.
                </p>

                <div id="alertBox" class="alert"></div>

                <form id="resetForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="password">
                            New Password
                            <span class="form-hint">(minimum 6 characters)</span>
                        </label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Enter new password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar" id="strength1"></div>
                            <div class="strength-bar" id="strength2"></div>
                            <div class="strength-bar" id="strength3"></div>
                            <div class="strength-bar" id="strength4"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                        <span class="form-error" id="passwordError">Password must be at least 6 characters</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                class="form-input" 
                                placeholder="Confirm new password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                            <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="confirmPasswordError">Passwords do not match</span>
                    </div>

                    <button type="submit" class="auth-btn" id="submitBtn">Reset Password</button>
                </form>
            </div>

            <!-- Success View -->
            <div class="success-view" id="successView">
                <div class="auth-icon success">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>

                <h1 class="auth-title">Password Reset!</h1>
                <p class="auth-subtitle">
                    Your password has been successfully reset. You can now sign in with your new password.
                </p>

                <button class="auth-btn" onclick="window.location.href='signin.html'">
                    Sign In
                </button>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('spotify_theme', newTheme);
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', toggleTheme);
            themeToggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleTheme();
                }
            });
        }

        // Form Elements
        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');
        const formView = document.getElementById('formView');
        const successView = document.getElementById('successView');
        const strengthText = document.getElementById('strengthText');

        // Password Toggle Functions
        function createPasswordToggle(toggleBtn, input) {
            toggleBtn.addEventListener('click', () => {
                const type = input.type === 'password' ? 'text' : 'password';
                input.type = type;
                toggleBtn.innerHTML = type === 'password' 
                    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            });
        }

        createPasswordToggle(document.getElementById('togglePassword'), passwordInput);
        createPasswordToggle(document.getElementById('toggleConfirmPassword'), confirmPasswordInput);

        // Password Strength Checker
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            return Math.min(strength, 4);
        }

        function updatePasswordStrength() {
            const password = passwordInput.value;
            const strength = checkPasswordStrength(password);
            
            const bars = ['strength1', 'strength2', 'strength3', 'strength4'].map(id => 
                document.getElementById(id)
            );
            
            const strengthLabels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const strengthClasses = ['', 'active', 'medium', 'medium', 'strong'];
            
            bars.forEach((bar, index) => {
                bar.className = 'strength-bar';
                if (index < strength) {
                    bar.classList.add(strengthClasses[strength] || 'active');
                }
            });
            
            strengthText.textContent = password.length > 0 ? strengthLabels[strength] : '';
        }

        passwordInput.addEventListener('input', () => {
            updatePasswordStrength();
            passwordInput.classList.remove('error');
            passwordError.classList.remove('visible');
        });

        confirmPasswordInput.addEventListener('input', () => {
            confirmPasswordInput.classList.remove('error');
            confirmPasswordError.classList.remove('visible');
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert visible ${type}`;
        }

        function hideAlert() {
            alertBox.className = 'alert';
        }

        // Form Submission
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            let isValid = true;
            
            if (password.length < 6) {
                passwordInput.classList.add('error');
                passwordError.classList.add('visible');
                isValid = false;
            }
            
            if (password !== confirmPassword) {
                confirmPasswordInput.classList.add('error');
                confirmPasswordError.classList.add('visible');
                isValid = false;
            }
            
            if (!isValid) return;
            
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            
            try {
                const result = await window.spotifieAuth.updatePassword(password);
                if (result.success) {
                    formView.classList.add('hidden');
                    successView.classList.add('visible');
                } else {
                    showAlert(result.error || 'Failed to reset password. Please try again.', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        // A recovery link is only valid if Supabase turns it into a session.
        // The page never reads or trusts tokens from the URL itself.
        document.addEventListener('DOMContentLoaded', async () => {
            submitBtn.disabled = true;
            await window.spotifieAuth.ready();

            // A configuration problem must not be reported as an expired link.
            const configError = window.spotifieAuth.getConfigError();
            if (configError) {
                showAlert(configError, 'error');
                return;
            }

            const session = await window.spotifieAuth.waitForRecoverySession(6000);

            if (session) {
                submitBtn.disabled = false;
            } else {
                showAlert('This reset link is invalid or has expired. Please request a new one.', 'error');
            }
        });
    </script>
</body>

</html>
