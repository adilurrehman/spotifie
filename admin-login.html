<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Developer Access | Spotifie</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utlity.css">
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            // Dark unless this browser has been told otherwise. Set here, before
            // any stylesheet or script, so nothing is ever painted light first.
            const savedTheme = localStorage.getItem('spotify_theme');
            document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        })();
    </script>
    <style>
        .admin-login-page {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 40px;
            background: transparent;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            /* A link that is the product name, not a link to read. */
            color: var(--text-primary);
        }

        .admin-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .admin-logo span {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .admin-badge {
            background: linear-gradient(135deg, #1db954, #1ed760);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 8px;
        }

        .admin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .admin-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(29, 185, 84, 0.2);
        }

        .admin-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(29, 185, 84, 0.3);
        }

        .admin-icon svg {
            width: 40px;
            height: 40px;
            color: #fff;
        }

        .admin-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .admin-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        .security-notice {
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .security-notice svg {
            flex-shrink: 0;
            color: #1db954;
        }

        .security-notice p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-field {
            position: relative;
        }

        .form-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-field input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-field input:focus {
            border-color: #1db954;
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.1);
        }

        .form-field input::placeholder {
            color: var(--text-muted);
        }

        .form-field input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 38px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .admin-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border: none;
            border-radius: 500px;
            font-size: 16px;
            font-weight: 700;
            /* Read on the green itself, not on the page behind it. */
            color: var(--text-on-accent);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .admin-submit:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
        }

        .admin-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-submit.loading {
            position: relative;
            color: transparent;
        }

        .admin-submit.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        .alert.success {
            background: rgba(29, 185, 84, 0.15);
            border: 1px solid rgba(29, 185, 84, 0.3);
            color: #1db954;
            display: block;
        }

        .alert.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            display: block;
        }

        /* Confirmation View */
        .confirmation-view {
            display: none;
            text-align: center;
        }

        .confirmation-view.active {
            display: block;
        }

        .confirmation-icon {
            width: 80px;
            height: 80px;
            background: rgba(29, 185, 84, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .confirmation-icon svg {
            width: 40px;
            height: 40px;
            color: #1db954;
        }

        .confirmation-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .confirmation-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .confirmation-email {
            font-weight: 600;
            color: #1db954;
        }

        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-top: 24px;
            transition: color 0.2s;
        }

        .back-to-home:hover {
            color: var(--text-primary);
        }

        /* Responsive */
        @media screen and (max-width: 480px) {
            .admin-card {
                padding: 24px;
            }

            .admin-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body class="admin-login-page">
    <header class="admin-header">
        <a href="index.html" class="admin-logo">
            <img src="img/logo.webp" alt="Spotifie logo">
            <span>Spotifie</span>
            <span class="admin-badge">Dev</span>
        </a>
    </header>

    <main class="admin-container">
        <div class="admin-card">
            <!-- Login Form View -->
            <div id="loginView">
                <div class="admin-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h1 class="admin-title">Developer Access</h1>
                <p class="admin-subtitle">Authorized personnel only</p>

                <div class="security-notice">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p>Sign in with your Spotifie account. Dashboard access is granted only to accounts listed as administrators.</p>
                </div>

                <div class="alert" id="alertBox"></div>

                <form class="admin-form" id="adminLoginForm">
                    <div class="form-field">
                        <label for="adminEmail">Developer Email</label>
                        <input type="email" id="adminEmail" placeholder="Enter developer email" required autocomplete="email">
                    </div>

                    <div class="form-field">
                        <label for="adminPassword">Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="admin-submit" id="submitBtn">
                        Sign In
                    </button>
                </form>

                <a href="index.html" class="back-to-home">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back to Spotifie
                </a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        // Administrator sign-in.
        // There is no second authentication system: this is the normal
        // Supabase password sign-in, followed by an admin check against the
        // app_admins table (which users cannot write to).
        const adminLoginForm = document.getElementById('adminLoginForm');
        const adminEmail = document.getElementById('adminEmail');
        const adminPassword = document.getElementById('adminPassword');
        const passwordToggle = document.getElementById('passwordToggle');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
        }

        function hideAlert() {
            alertBox.className = 'alert';
        }

        if (passwordToggle) {
            passwordToggle.addEventListener('click', () => {
                adminPassword.type = adminPassword.type === 'password' ? 'text' : 'password';
            });
        }

        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = adminEmail.value.trim();
            const password = adminPassword.value;

            if (!email || !password) {
                showAlert('Enter your email address and password', 'error');
                return;
            }

            submitBtn.disabled = true;

            try {
                const result = await window.spotifieAuth.signIn(email, password);
                if (!result.success) {
                    showAlert(result.error || 'Invalid email or password', 'error');
                    return;
                }

                const admin = await window.spotifieAuth.isAdmin();
                if (!admin) {
                    // Signed in, but not an administrator. The account stays
                    // signed in as a normal user; the dashboard stays closed.
                    showAlert('This account does not have administrator access.', 'error');
                    return;
                }

                showAlert('Signed in. Opening the dashboard...', 'success');
                setTimeout(() => {
                    window.location.replace('admin-dashboard.html');
                }, 800);
            } catch (err) {
                console.error('Admin sign-in error:', err);
                showAlert('An error occurred. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Already signed in as an administrator? Go straight to the dashboard.
        document.addEventListener('DOMContentLoaded', async () => {
            await window.spotifieAuth.ready();

            const configError = window.spotifieAuth.getConfigError();
            if (configError) {
                showAlert(configError, 'error');
                submitBtn.disabled = true;
                return;
            }

            const session = await window.spotifieAuth.getSession();
            if (!session) return;

            const admin = await window.spotifieAuth.isAdmin();
            if (admin) {
                window.location.replace('admin-dashboard.html');
            }
        });
    </script>
</body>

</html>
